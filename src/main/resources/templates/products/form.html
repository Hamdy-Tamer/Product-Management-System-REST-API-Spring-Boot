<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${mode == 'add' ? 'Add Product' : 'Edit Product'}">Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 720px;">

    <!-- Header -->
    <div class="d-flex align-items-center mb-4">
        <a th:href="@{/products}" class="btn btn-outline-secondary btn-sm me-3">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2 class="mb-0">
            <i class="fa-solid fa-box-open text-primary me-2"></i>
            <span th:text="${mode == 'add' ? 'Add Product' : 'Edit Product'}">Product</span>
        </h2>
    </div>

    <!-- Error alert -->
    <div th:if="${error}" class="alert alert-danger d-flex align-items-center" role="alert">
        <i class="fa-solid fa-circle-exclamation me-2"></i>
        <span th:text="${error}"></span>
    </div>

    <!-- Form card -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <form th:action="${mode == 'add'}
                             ? @{/products}
                             : @{'/products/' + ${product.productID} + '/edit'}"
                  th:object="${product}"
                  method="post"
                  novalidate>

                <!-- Product Name -->
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="productName">
                        <i class="fa-solid fa-tag text-secondary me-1"></i> Product Name
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-tag"></i></span>
                        <input type="text" id="productName"
                               class="form-control"
                               th:field="*{productName}"
                               placeholder="e.g. iPhone 15 Pro"
                               required>
                    </div>
                </div>

                <!-- Serial Number -->
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="serialNumber">
                        <i class="fa-solid fa-barcode text-secondary me-1"></i> Serial Number
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-barcode"></i></span>
                        <input type="text" id="serialNumber"
                               class="form-control"
                               th:field="*{serialNumber}"
                               placeholder="e.g. SN-IPH15-00001"
                               required>
                    </div>
                </div>

                <!-- Brand + Category side by side -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold" for="brand">
                            <i class="fa-solid fa-copyright text-secondary me-1"></i> Brand
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-copyright"></i></span>
                            <select id="brand" class="form-select" th:field="*{brand}" required>
                                <option value="">-- Select brand --</option>
                                <option th:each="b : ${brands}" th:value="${b}" th:text="${b}">APPLE</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold" for="category">
                            <i class="fa-solid fa-layer-group text-secondary me-1"></i> Category
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-layer-group"></i></span>
                            <select id="category" class="form-select" th:field="*{category}" required>
                                <option value="">-- Select category --</option>
                                <option th:each="c : ${categories}" th:value="${c}" th:text="${c}">LAPTOP</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Quantity + Price side by side -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold" for="quantity">
                            <i class="fa-solid fa-cubes text-secondary me-1"></i> Quantity
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-cubes"></i></span>
                            <input type="number" id="quantity"
                                   class="form-control"
                                   th:field="*{quantity}"
                                   min="0" required>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold" for="price">
                            <i class="fa-solid fa-dollar-sign text-secondary me-1"></i> Price
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-dollar-sign"></i></span>
                            <input type="number" id="price"
                                   class="form-control"
                                   th:field="*{price}"
                                   step="0.01" min="0.01" required>
                        </div>
                    </div>
                </div>

                <!-- Image URL -->
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="imageUrl">
                        <i class="fa-solid fa-image text-secondary me-1"></i> Image URL
                    </label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-link"></i></span>
                        <input type="text" id="imageUrl"
                               class="form-control"
                               th:field="*{imageUrl}"
                               placeholder="https://..."
                               oninput="previewImage(this.value)">
                    </div>
                </div>

                <!-- Live image preview -->
                <div id="previewWrap"
                     class="mb-3"
                     th:classappend="${product.imageUrl == null or product.imageUrl.isBlank()} ? 'd-none'">
                    <label class="form-label fw-semibold">
                        <i class="fa-solid fa-eye text-secondary me-1"></i> Preview
                    </label>
                    <div>
                        <img id="preview"
                             th:src="${product.imageUrl}"
                             class="img-thumbnail"
                             style="max-height: 180px;"
                             onerror="this.style.display='none';">
                    </div>
                </div>

                <!-- Actions -->
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/products}" class="btn btn-outline-secondary">
                        <i class="fa-solid fa-xmark me-1"></i> Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-floppy-disk me-1"></i> Save
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<script>
function previewImage(url) {
    const wrap = document.getElementById('previewWrap');
    const img  = document.getElementById('preview');
    if (url && url.trim()) {
        img.src = url.trim();
        img.style.display = 'block';
        wrap.classList.remove('d-none');
    } else {
        wrap.classList.add('d-none');
    }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
