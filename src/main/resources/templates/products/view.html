<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.productName}">Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5" style="max-width: 900px;">

    <a th:href="@{/products}" class="btn btn-outline-secondary btn-sm mb-3">
        <i class="fa-solid fa-arrow-left me-1"></i> Back to list
    </a>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <div class="row g-4">

                <!-- Image -->
                <div class="col-md-5 text-center">
                    <img th:if="${product.imageUrl != null and !product.imageUrl.isBlank()}"
                         th:src="${product.imageUrl}"
                         class="img-fluid rounded border"
                         style="max-height: 320px; object-fit: contain;"
                         onerror="this.onerror=null;this.src='/images/placeholder.png';">
                    <img th:unless="${product.imageUrl != null and !product.imageUrl.isBlank()}"
                         th:src="@{/images/placeholder.png}"
                         class="img-fluid rounded border"
                         style="max-height: 320px; object-fit: contain;">
                </div>

                <!-- Details -->
                <div class="col-md-7">
                    <h3 class="mb-3" th:text="${product.productName}">iPhone 15 Pro</h3>

                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex">
                            <span class="text-muted" style="width:140px;">
                                <i class="fa-solid fa-hashtag me-1"></i> ID
                            </span>
                            <strong th:text="${product.productID}">1</strong>
                        </li>
                        <li class="list-group-item d-flex">
                            <span class="text-muted" style="width:140px;">
                                <i class="fa-solid fa-barcode me-1"></i> Serial
                            </span>
                            <code th:text="${product.serialNumber}">SN-001</code>
                        </li>
                        <li class="list-group-item d-flex">
                            <span class="text-muted" style="width:140px;">
                                <i class="fa-solid fa-copyright me-1"></i> Brand
                            </span>
                            <span class="badge bg-secondary" th:text="${product.brand}">APPLE</span>
                        </li>
                        <li class="list-group-item d-flex">
                            <span class="text-muted" style="width:140px;">
                                <i class="fa-solid fa-layer-group me-1"></i> Category
                            </span>
                            <span class="badge bg-info text-dark" th:text="${product.category}">SMARTPHONE</span>
                        </li>
                        <li class="list-group-item d-flex">
                            <span class="text-muted" style="width:140px;">
                                <i class="fa-solid fa-cubes me-1"></i> Quantity
                            </span>
                            <strong th:text="${product.quantity}">10</strong>
                        </li>
                        <li class="list-group-item d-flex">
                            <span class="text-muted" style="width:140px;">
                                <i class="fa-solid fa-dollar-sign me-1"></i> Price
                            </span>
                            <strong class="text-success"
                                    th:text="${'$' + #numbers.formatDecimal(product.price, 1, 2)}">$999.99</strong>
                        </li>
                    </ul>

                    <div class="d-flex gap-2 mt-4">
                        <a th:href="@{'/products/' + ${product.productID} + '/edit'}"
                           class="btn btn-success">
                            <i class="fa-solid fa-pen-to-square me-1"></i> Update
                        </a>
                        <form th:action="@{'/products/' + ${product.productID} + '/delete'}"
                              method="post"
                              onsubmit="return confirm('Delete this product?');">
                            <button type="submit" class="btn btn-danger">
                                <i class="fa-solid fa-trash me-1"></i> Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
